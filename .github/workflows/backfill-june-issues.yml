name: Backfill June AI issues

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backfill-june-issues.yml"
      - "ai-newspaper/scripts/backfill-issues.mjs"
      - "ai-newspaper/scripts/collect-ai-news.mjs"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-newspaper

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-newspaper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Backfill June issues
        run: npm run backfill:june

      - name: Build site
        run: npm run build

      - name: Commit backfilled issues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/issues/*.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: backfill June AI issues"
          git push
