name: Generate daily AI issue

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-newspaper

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-newspaper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Collect AI news
        run: npm run collect:news

      - name: Generate daily issue
        run: npm run generate:issue
        env:
          AI_DAILY_SOURCE_FILE: .cache/ai-daily-source.json

      - name: Build site
        run: npm run build

      - name: Commit generated issue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/issues/*.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: generate daily AI issue"
          git push
